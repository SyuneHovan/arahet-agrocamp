<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Էջը չի գտնվել · Ագրո ճամբար</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#204d49;--rust:#c7754c;--tan:#faf8f3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--tan);color:var(--green);font-family:'Noto Sans Armenian',sans-serif}
a{color:inherit;text-decoration:none}
header{background:#fffdf9;border-bottom:1px solid #ecede7}
.nav{max-width:1080px;margin:auto;min-height:70px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;line-height:1.45;font-weight:900;font-size:16px}
.brand small{font-size:10px;color:#7b8d80;font-weight:800;letter-spacing:.06em}
.nav-link{font-size:12px;font-weight:800}
main{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;padding:65px 20px 135px;background:linear-gradient(#fffdfa,#faf8f3 72%,#d8e4d7)}
main:before{content:"";position:absolute;width:350px;height:300px;background:#f7e5cc;border-radius:47% 53% 51% 49%;top:5%;left:-145px}
main:after{content:"";position:absolute;bottom:0;left:0;right:0;height:125px;background:#b5ccb9;clip-path:polygon(0 64%,17% 25%,32% 72%,49% 17%,68% 72%,84% 29%,100% 64%,100% 100%,0 100%)}
.content{position:relative;z-index:1;text-align:center;max-width:680px}
.code{font-size:clamp(105px,21vw,190px);font-weight:900;line-height:1;letter-spacing:-.075em;color:var(--rust)}
.kicker{font-size:12px;font-weight:900;letter-spacing:.1em;color:#8d8171;margin:20px 0 8px}
h1{font-size:clamp(30px,6vw,51px);line-height:1.22;letter-spacing:-.04em;margin:12px 0}
p{font-size:15px;line-height:1.9;color:#536f63;margin:12px auto 28px;max-width:520px}
.btn{display:inline-block;border-radius:40px;background:var(--rust);color:white;padding:13px 25px;font-size:14px;font-weight:900}
.btn:hover{background:#ac5f3e}
footer{background:var(--green);color:#f3f0e6;text-align:center;padding:23px 15px;font-size:11px}
@media(max-width:480px){.nav{padding:12px 18px}.nav-link{font-size:11px}main{padding-bottom:140px}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/" aria-label="Գլխավոր էջ">ԱՐԱՀԵՏ<small>ԱԳՐՈ ՃԱՄԲԱՐ</small></a><a class="nav-link" href="/">Գլխավոր էջ ↗</a></div></header>
<main><div class="content"><div class="code" aria-label="Սխալ 404">404</div><div class="kicker">ԿՈՐԱԾ ՃԱՆԱՊԱՐՀ</div><h1>Այս էջը չի գտնվել</h1><p>Կարծես սխալ արահետով ես եկել։ Վերադարձիր գլխավոր էջ՝ մեր ճամբարի մասին ամեն ինչ գտնելու համար։</p><a class="btn" href="/">Վերադառնալ գլխավոր էջ →</a></div></main>
<footer>Արահետ · Ագրոճամբար Ելփինում · 2026</footer>
</body>
</html>
